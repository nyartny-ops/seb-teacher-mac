name: Build SEB Teacher (macOS)

# Собирает .dmg-установщик на облачном Mac GitHub.
# Запуск: вкладка Actions → «Build SEB Teacher (macOS)» → Run workflow,
# или автоматически при каждом push в main. Готовый SEBastian-mac.dmg —
# в разделе Artifacts внизу страницы запуска, а также в Releases (оттуда его
# раздаёт сайт SEBастьяна).

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Тип облачного Mac (macos-15-intel, macos-15, macos-26)'
        required: false
        default: 'macos-15-intel'
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    # Если сборка долго стоит в очереди, можно выбрать другой тип Mac при ручном запуске.
    runs-on: ${{ github.event.inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^26'

      # Необязательно: подпись сертификатом Developer ID и нотаризация.
      # Нужны секреты репозитория MACOS_CERTIFICATE (p12 в base64),
      # MACOS_CERTIFICATE_PASSWORD, MACOS_SIGN_IDENTITY, а для нотаризации
      # ещё APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD.
      - name: Import signing certificate (optional)
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        if: env.MACOS_CERTIFICATE != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          if [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials seb-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
            echo "NOTARY_PROFILE=seb-notary" >> "$GITHUB_ENV"
          fi
          echo "SIGN_IDENTITY=${{ secrets.MACOS_SIGN_IDENTITY }}" >> "$GITHUB_ENV"

      # dmgbuild рисует красивое окно установщика (фон, стрелка, расположение иконок)
      - name: Install dmgbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgvenv"
          "$RUNNER_TEMP/dmgvenv/bin/pip" install --quiet dmgbuild
          echo "$RUNNER_TEMP/dmgvenv/bin" >> "$GITHUB_PATH"

      - name: Build DMG
        run: bash scripts/build-teacher-dmg.sh

      # Проверка запуска: приложение должно остаться работать (ждать на панели
      # преподавателя), а не завершиться сразу после старта.
      # Проверка запуска и автотест интерфейса: SEB с паролем преподавателя в переменной
      # окружения сам проходит панель → настройки → начало контрольной и отмечает каждый
      # этап файлом в /tmp/seb-autotest; на каждом этапе делается скриншот.
      # Скриншоты и логи кладутся в ветку dist вместе с .dmg.
      - name: Smoke test (launch + UI autotest)
        run: |
          mkdir -p build/test
          touch build/test/.start
          rm -rf /tmp/seb-autotest
          sudo rm -rf "/Applications/Safe Exam Browser.app"
          sudo cp -R "build/DerivedData/Build/Products/Release/Safe Exam Browser.app" /Applications/
          APP="/Applications/Safe Exam Browser.app"
          BIN="$APP/Contents/MacOS/$(ls "$APP/Contents/MacOS" | head -1)"
          defaults delete -g AppleInterfaceStyle 2>/dev/null || true
          printf 'CLIPBOARD-TEST-42' | pbcopy
          SEB_TEACHER_AUTOTEST_PASSWORD=32123212 "$BIN" > build/test/stdout.log 2>&1 &
          PID=$!
          for stage in 1-panel 2-settings 3-settings-bottom 4-exam; do
            for i in $(seq 1 90); do
              [ -f "/tmp/seb-autotest/$stage" ] && break
              kill -0 $PID 2>/dev/null || break
              sleep 1
            done
            if [ -f "/tmp/seb-autotest/$stage" ]; then
              screencapture -x "build/test/$stage.png" 2>/dev/null || echo "screencapture failed for $stage"
              echo "stage $stage: screenshot taken"
            else
              echo "stage $stage: not reached"
              screencapture -x "build/test/$stage-NOT-REACHED.png" 2>/dev/null || true
            fi
          done
          sleep 15; screencapture -x build/test/5-exam-later.png 2>/dev/null || true
          # Private clipboard is switched off in the autotest: the system clipboard must survive the exam start
          CLIP="$(pbpaste)"; echo "clipboard after exam start: '$CLIP'" | tee build/test/clipboard.txt
          # Color guard is switched on in the autotest: switching to dark mode must lock SEB
          defaults write -g AppleInterfaceStyle Dark
          sleep 8; screencapture -x build/test/6-color-lock.png 2>/dev/null || true
          defaults delete -g AppleInterfaceStyle 2>/dev/null || true
          log show --last 3m --style compact --predicate 'process CONTAINS "WebKit" OR process CONTAINS "Safe Exam" OR subsystem == "com.apple.WebKit"' 2>/dev/null | grep -iE "error|fail|crash|terminat|denied|sandbox" | head -300 > build/test/system-webkit.log || true
          ALIVE=0
          if kill -0 $PID 2>/dev/null; then ALIVE=1; echo "SEB is running - OK"; kill -9 $PID || true; fi
          find ~/Library/Logs -newer build/test/.start -type f \( -iname "*.log" -o -iname "*.ips" -o -iname "*.crash" \) 2>/dev/null | head -20 | while read -r f; do cp "$f" build/test/ 2>/dev/null; done
          ls -la build/test
          if [ "$ALIVE" != "1" ]; then
            echo "SEB exited early"; tail -100 build/test/stdout.log
            f=$(ls -t ~/Library/Logs/DiagnosticReports/*Safe* 2>/dev/null | head -1); [ -n "$f" ] && head -150 "$f"
            exit 1
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            build/xcodebuild.log
            build/test/
          if-no-files-found: ignore

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: SEBastian-mac-dmg
          path: build/SEBastian-mac.dmg
          if-no-files-found: error

      # Копия .dmg в ветке dist — её удобно скачивать через git, если загрузка
      # артефактов с серверов GitHub идёт медленно.
      - name: Publish DMG to dist branch
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          mkdir -p "$RUNNER_TEMP/dist/test"
          cp build/SEBastian-mac.dmg "$RUNNER_TEMP/dist/" 2>/dev/null || true
          cp -R build/test/. "$RUNNER_TEMP/dist/test/" 2>/dev/null || true
          cp build/xcodebuild.log "$RUNNER_TEMP/dist/test/" 2>/dev/null || true
          cd "$RUNNER_TEMP/dist"
          git init -q
          git checkout -q -b dist
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "SEBastian-mac.dmg from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" dist

      # Каждая успешная сборка из main становится релизом — сайт SEBастьяна
      # отдаёт студентам файл из последнего релиза (releases/latest).
      - name: Publish release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('mac-build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('SEBастьян для Mac · сборка {0}', github.run_number) }}
          body: |
            Safe Exam Browser с панелью преподавателя и ключом доступа SEBастьяна.
            ⚠ Бета-версия — используйте на свой страх и риск.
          make_latest: true
          files: build/SEBastian-mac.dmg
